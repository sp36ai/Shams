appId: com.astrosarfaraz.shamsalasrar
name: 'Journey — sign up through onboarding to the Oracle'
---
# Full first-run journey against the real Firebase backend:
# sign-up → location grant → 3-question onboarding → Oracle screen.
# Creates a throwaway account on each run. Issue #131: this used to be
# inputRandomEmail, which generates realistic @gmail.com addresses that
# may belong to real people -- any verification/welcome email Firebase
# sends went straight to a stranger's inbox. Uses a domain the repo
# owner controls instead (e2e.shamsalasrar.test), so a CI-generated
# address can never collide with a real account.
# Onboarding profile inference falls back to 'clarity' without an
# Anthropic key, so this flow needs no secrets.

- launchApp:
    clearState: true
    permissions:
      location: allow

# Land on Auth (splash + auth bootstrap), switch to sign-up. Widened for
# the same CI-environment performance-ceiling reason as 01_auth_validation.yaml
# (see its own comment) -- confirmed via logcat that the JS thread/auth
# timeout fire on schedule, only the UI paint itself lags under CI load.
- extendedWaitUntil:
    visible:
      id: 'auth-tab-signup'
    timeout: 90000
- tapOn:
    id: 'auth-tab-signup'

- tapOn:
    id: 'auth-input-name'
- inputText: 'CI Test Seeker'
- tapOn:
    id: 'auth-input-email'
# issue #131: a controlled domain, not inputRandomEmail's real-looking
# @gmail.com addresses.
#
# Confirmed on run #532 that a ${...} JS-interpolated expression here
# broke sign-up entirely -- no account was created, and the flow died
# at the very next step waiting for the location screen. A first
# attempted fix (collapsing two ${...} blocks into one) doesn't hold
# up on its own logic: if Maestro isn't evaluating ${...} at all, a
# single block wouldn't be evaluated either, and every run would type
# the identical literal string -- passing this app's email regex
# (whitespace-free) but colliding with "email already in use" on every
# run after the first, a different failure than what run #532 showed.
# Avoids the question entirely by using Maestro's own built-in random-
# data commands instead of any ${...} JS evaluation -- inputText calls
# on the same focused field append rather than replace, so these three
# lines concatenate into one address.
- inputText: 'e2e-'
- inputRandomNumber:
    length: 10
- inputText: '@e2e.shamsalasrar.test'
- tapOn:
    id: 'auth-input-password'
- inputText: 'CiTestPass!2026'
- tapOn:
    id: 'auth-input-confirm'
- inputText: 'CiTestPass!2026'
- hideKeyboard
- tapOn:
    id: 'auth-submit-btn'

# Firebase sign-up roundtrip → location gate
- extendedWaitUntil:
    visible: 'Grant location access'
    timeout: 30000
- tapOn: 'Grant location access'

# Onboarding — Question 1 (location fix can take up to 8s)
- extendedWaitUntil:
    visible: 'QUESTION ONE — INTENT'
    timeout: 20000
- tapOn: 'I face a decision and need clarity'

- extendedWaitUntil:
    visible: 'QUESTION TWO — REGISTER'
    timeout: 5000
- tapOn: 'Directly — I want clear answers'

- extendedWaitUntil:
    visible: 'QUESTION THREE — TIMING'
    timeout: 5000
- tapOn: 'Before important choices'

# Profile inference (falls back fast without API key)
- extendedWaitUntil:
    visible:
      id: 'onboarding-enter-btn'
    timeout: 20000
- tapOn:
    id: 'onboarding-enter-btn'

# Should land on the Oracle home dashboard (fixed header, always above the
# fold — the dashboard body below it now scrolls, so don't assert visibility
# on scrollable content here).
- extendedWaitUntil:
    visible: 'SHAMS AL-ASRĀR'
    timeout: 10000
