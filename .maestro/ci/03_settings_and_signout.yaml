appId: com.astrosarfaraz.shamsalasrar
name: 'Settings — plan display and sign out'
---
# Each E2E matrix leg (issue #124 / PR #125) boots its own fresh emulator,
# so this flow can no longer assume 02_signup_journey's session carried
# over from a device the two flows used to share. Signs in with a
# dedicated, pre-seeded E2E test account instead of signing up a new one:
# the E2E build's google-services.json targets the real production
# Firebase project (shams-app-4d0e7), so creating a fresh account here on
# every run would create real throwaway accounts in production Auth and
# add ~12 minutes/run, duplicating 02_signup_journey's own sign-up cost.
#
# Requires the E2E_TEST_ACCOUNT_EMAIL / E2E_TEST_ACCOUNT_PASSWORD GitHub
# secrets (exposed to Maestro as MAESTRO_-prefixed env vars — see ci.yml's
# e2e-test job) and a real Firebase Auth account already provisioned in
# shams-app-4d0e7 matching those credentials, left on the free plan.
#
# The location and onboarding gates are device-local (settingsStore's
# MMKV flags, not the account), so clearState: true always shows them
# again after sign-in, whatever the account has done before. The flow
# walks through them with the same steps as 02_signup_journey.yaml.
- launchApp:
    clearState: true
    permissions:
      location: allow

- extendedWaitUntil:
    visible:
      id: 'auth-tab-signin'
    timeout: 90000

- tapOn:
    id: 'auth-input-email'
- inputText: ${MAESTRO_E2E_TEST_ACCOUNT_EMAIL}
- tapOn:
    id: 'auth-input-password'
- inputText: ${MAESTRO_E2E_TEST_ACCOUNT_PASSWORD}
- hideKeyboard
- tapOn:
    id: 'auth-submit-btn'

# Firebase sign-in roundtrip → location gate. Widened for the same
# CI-environment performance-ceiling reason as 01_auth_validation.yaml
# (see its own comment).
#
# Waits for whichever comes first (visible text is matched as a regex):
# the location gate, or one of the AuthScreen errors. The assertions after
# it then name the cause of a failed sign-in: a local validation error
# means the typed credentials were wrong (e.g. ${...} not interpolated),
# the gate message means Firebase rejected them.
- extendedWaitUntil:
    visible: 'Grant location access|The gate did not open.*|Enter a valid email address|Password must be at least 8 characters'
    timeout: 90000
- assertNotVisible: 'Enter a valid email address'
- assertNotVisible: 'Password must be at least 8 characters'
- assertNotVisible: 'The gate did not open.*'
- tapOn: 'Grant location access'

# Onboarding — same answers and timeouts as 02_signup_journey.yaml
- extendedWaitUntil:
    visible: 'QUESTION ONE — INTENT'
    timeout: 20000
- tapOn: 'I face a decision and need clarity'

- extendedWaitUntil:
    visible: 'QUESTION TWO — REGISTER'
    timeout: 5000
- tapOn: 'Directly — I want clear answers'

- extendedWaitUntil:
    visible: 'QUESTION THREE — TIMING'
    timeout: 5000
- tapOn: 'Before important choices'

- extendedWaitUntil:
    visible:
      id: 'onboarding-enter-btn'
    timeout: 60000
- tapOn:
    id: 'onboarding-enter-btn'

# Settings is a gear icon in the Home header, not a tab.
- extendedWaitUntil:
    visible:
      id: 'settings-gear-btn'
    timeout: 30000

- tapOn:
    id: 'settings-gear-btn'
- assertVisible: 'AL-DAFTAR'

# Free plan shown for the pre-seeded test account (never upgraded)
- assertVisible: 'Free'

# Sign out — cancel first, then confirm
- tapOn: 'Sign Out'
- assertVisible: 'Sign out of Shams al-Asrar?'
- tapOn: 'Cancel'
- assertVisible: 'AL-DAFTAR'

- tapOn: 'Sign Out'
- assertVisible: 'Sign out of Shams al-Asrar?'
- tapOn:
    text: 'Sign Out'
    index: 1

# Back at the Auth gate
- extendedWaitUntil:
    visible:
      id: 'auth-tab-signin'
    timeout: 10000
