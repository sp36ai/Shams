name: Deploy Cloud Functions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# PHASE 6D-1: gated on CI, not on a bare push to main.
#
# Previously this workflow triggered directly on `push: branches: [main]`,
# independently of whether the "CI" workflow (ci.yml) had passed for that
# same commit — a push that failed lint/typecheck/tests could still deploy
# straight to production. `workflow_run` makes this workflow fire only
# after "CI" (ci.yml's own `name:`) finishes; the job itself then checks
# `conclusion == 'success'` before doing anything. `workflow_dispatch` is
# kept as a deliberate manual override, unaffected by this gate.
#
# Known, disclosed side effect: `workflow_run` does not support a `paths`
# filter (GitHub Actions rejects one under this trigger type), so the
# previous `paths: ['functions/**', 'src/astrology/**', ...]` scoping is
# necessarily dropped — this workflow now runs on every successful CI
# completion on `main`, not only ones touching those paths. The deploy
# step below (`--force`) is idempotent, so an unnecessary run redeploys
# identical code rather than doing anything unsafe; the cost is wasted CI
# minutes, not incorrect behavior. See docs/audit/PHASE_6D_1_REMEDIATION.md.
#
# PHASE 7C follow-up: `CI` (ci.yml) never runs the Firestore rules test
# suite, and the dedicated `Firestore Rules Testing` workflow is
# path-filtered (only fires when firestore.rules/firestore.rules.test.ts/
# etc. change) — so gating on it via a second `workflow_run` would silently
# skip deploys for every commit that doesn't touch those paths, since a
# workflow that never runs never emits a `workflow_run` event. Instead the
# `verify-rules` job below runs the same `npm run test:rules` suite
# directly, on every deploy, so a broken security-rules regression can
# never reach production regardless of what else changed in the commit.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-rules:
    name: Verify Firestore rules
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator (spawned by `firebase emulators:exec` below)
      # is a JVM process — it will not start without a JRE on PATH.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # firebase-tools >= 15 refuses to start the Firestore emulator on a
          # JDK older than 21 ("no longer supports Java version before 21").
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore Rules test suite (emulator + jest)
        run: npm run test:rules

  deploy:
    name: Deploy to asia-south1
    needs: verify-rules
    runs-on: ubuntu-24.04
    # Manual dispatch always runs; a CI-triggered run only proceeds if CI
    # actually passed — a failed or cancelled CI run must not deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Deploy the exact commit CI validated, not just "main" at
          # whatever point this job happens to run (which could have moved
          # on if another push landed in between). Falls back to the
          # triggering ref for a manual workflow_dispatch run, where
          # workflow_run context does not exist.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Build
        run: npm run build
        working-directory: functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only functions --project shams-app-4d0e7 --force

      - name: Health check
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://asia-south1-shams-app-4d0e7.cloudfunctions.net/health
