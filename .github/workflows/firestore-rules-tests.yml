name: Firestore Rules Testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.rules.test.ts'
      - 'firebase.test.json'
      - 'package.json'
      - '.github/workflows/firestore-rules-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.rules.test.ts'
      - 'firebase.test.json'
      - 'package.json'
      - '.github/workflows/firestore-rules-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-tests:
    name: Run Security Rules Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator (spawned by `firebase emulators:exec` below)
      # is a JVM process — it will not start without a JRE on PATH.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # firebase-tools >= 15 refuses to start the Firestore emulator on a
          # JDK older than 21 ("no longer supports Java version before 21").
          # This JDK serves only the emulator JVM for this workflow - it is
          # unrelated to ci.yml's Android/Gradle toolchain, which stays on 17.
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # PHASE 6C-1: runs the real behavioral Firestore Rules test suite
      # (firestore.rules.test.ts, @firebase/rules-unit-testing) against a
      # live local Firestore emulator, via the repo's own `test:rules`
      # script — the same command a contributor runs locally. This job
      # previously only ran a static syntax/brace-balance check on
      # firestore.rules and never executed the behavioral suite at all;
      # see docs/audit/PHASE_6C_1_REMEDIATION.md.
      - name: Run Firestore Rules test suite (emulator + jest)
        run: npm run test:rules
