name: Firestore Rules Testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.rules.test.ts"
      - "firebase.test.json"
      - "jest.rules.config.cjs"
      - "package.json"
      - ".github/workflows/firestore-rules-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.rules.test.ts"
      - "firebase.test.json"
      - "jest.rules.config.cjs"
      - "package.json"
      - ".github/workflows/firestore-rules-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-validation:
    name: Validate Security Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Validate Firestore Rules Syntax
        run: |
          echo "Validating firestore.rules file..."

          # Check file exists
          if [ ! -f firestore.rules ]; then
            echo "✗ firestore.rules file not found"
            exit 1
          fi
          echo "✓ firestore.rules file exists"

          # Check basic syntax
          if grep -q "rules_version = '2'" firestore.rules; then
            echo "✓ Has rules_version = '2'"
          else
            echo "✗ Missing or incorrect rules_version"
            exit 1
          fi

          if grep -q "service cloud.firestore" firestore.rules; then
            echo "✓ Has service cloud.firestore"
          else
            echo "✗ Missing service cloud.firestore"
            exit 1
          fi

          if grep -q "match /databases/{database}/documents" firestore.rules; then
            echo "✓ Has database documents matcher"
          else
            echo "✗ Missing database documents matcher"
            exit 1
          fi

          # Check for mismatched braces
          open_braces=$(grep -o '{' firestore.rules | wc -l)
          close_braces=$(grep -o '}' firestore.rules | wc -l)
          if [ "$open_braces" -eq "$close_braces" ]; then
            echo "✓ Brace count balanced ($open_braces opening, $close_braces closing)"
          else
            echo "✗ Mismatched braces ($open_braces opening, $close_braces closing)"
            exit 1
          fi

          echo ""
          echo "✅ Firestore rules syntax check passed"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # The Firestore emulator is a Java process.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      # firebase-tools provides the emulator; kept out of package.json (heavy)
      # and installed here so `npm run test:rules` can boot the emulator.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Run Firestore rules tests (emulator)
        run: npm run test:rules
