name: Deploy Firebase Hosting

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# PHASE 6D-1: gated on CI, not on a bare push to main — see
# deploy-functions.yml's own header comment for the full rationale and the
# disclosed `paths` side effect this same change carries here too.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      # A manual run bypasses the CI-triggered path above, so require that
      # CI already succeeded for this exact commit before anything deploys.
      - name: Require a passing CI run for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=1" --jq '.total_count')
          if [ "${count}" -lt 1 ]; then
            echo "::error::CI has not succeeded for ${{ github.sha }}. Wait for CI to pass on this commit, then dispatch again."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: shams-app-4d0e7
          channelId: live
