name: Deploy Firebase Hosting

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# PHASE 6D-1: gated on CI, not on a bare push to main — see
# deploy-functions.yml's own header comment for the full rationale and the
# disclosed `paths` side effect this same change carries here too.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Only a successful CI run triggered by a push to main in this
    # repository may deploy. `branches: [main]` in `on:` alone matches the
    # head branch NAME, so CI on a fork PR from a branch called "main" would
    # pass it and this job would run the fork's code with the deploy
    # credentials.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: shams-app-4d0e7
          channelId: live
