name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      upload_debug_apk:
        description: >-
          Upload the debug APK as a run artifact (for manual device
          sideloading). Off by default — see the "Upload debug APK" step's
          own comment for why ordinary CI runs no longer do this
          unconditionally.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  app-quality:
    name: App Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Dead code guard (orphans)
        run: npm run check:orphans

  functions-quality:
    name: Functions Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # PHASE 5B-R: functions/src/engine/ is a generated mirror of
      # src/astrology/ (see functions/scripts/sync-engine.mjs). This fails
      # fast, with a named/attributable step, if the committed mirror has
      # drifted from its source — before Lint or Build get a chance to run
      # against (or silently paper over) stale engine code. See
      # docs/audit/PHASE_5B_REMEDIATION.md.
      - name: Verify engine mirror is in sync
        run: npm run verify-engine-sync

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

  e2e:
    name: E2E Tests (Maestro)
    runs-on: ubuntu-latest
    needs: app-quality
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PHASE 8A-11/8A-12: this job's runner ran out of local disk mid-run
      # (docs/audit/PHASE_8A_11_RUNNER_DISK_INVESTIGATION.md) while installing
      # the Android emulator system image -- the last, and one of the
      # largest, packages this job downloads. Removed here are large
      # pre-installed toolchains ubuntu-latest ships that this job never
      # uses (.NET SDK, Haskell/GHC, Boost, the CodeQL bundle) plus unused
      # Docker images -- none of these are Android SDK, Gradle, Node, or
      # Java components this job depends on, so removing them cannot affect
      # the build. Placed before any download so the freed space is
      # available for everything that follows (npm ci, the Gradle build,
      # and the Android SDK/emulator install), not just the last step.
      - name: Free disk space (pre-build)
        run: |
          echo "::group::Disk usage before cleanup"
          df -h
          echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker image prune --all --force || true
          echo "::group::Disk usage after cleanup"
          df -h
          echo "::endgroup::"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Use real google-services.json from secret if available,
      # otherwise fall back to the CI mock (structure-valid, placeholder creds).
      # The mock allows Gradle to compile; Firebase calls will fail at runtime
      # which is acceptable — E2E flows test UI logic, not live Firebase.
      - name: Write google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
            echo "Using real google-services.json from secret"
          else
            cp android/app/google-services.json.ci android/app/google-services.json
            echo "Using CI mock google-services.json (no secret configured)"
          fi

      # PHASE 8A-11 found that on both sampled failing runs, the cache-save
      # (post-job) step was skipped along with the rest of the job -- so a
      # run that fails downstream of this step never warms the cache, making
      # the *next* run's cold-cache risk worse, not better. PHASE 8A-12
      # tried save-always: true on the combined actions/cache@v4 action to
      # fix this; PHASE 8A-14 found, from actions/cache's own upstream
      # source, that this could never have worked: save-always is deprecated
      # and only ever controls whether to skip saving on an *exact cache
      # hit* -- the combined action's post step is separately, unconditionally
      # gated on `post-if: success()`, hardcoded in its action.yml and not
      # parameterized by any input. Since a later step (Setup Android
      # emulator) fails on a cold-cache run, success() is false by the time
      # that gate is checked, so the save is skipped regardless of
      # save-always. Fixed here per PHASE_8A_14's own documented remedy:
      # split into the two composite actions, with an explicit save step
      # below carrying its own if: always(), decoupled entirely from the
      # job's overall success/failure state.
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: gradle-

      # debug.keystore is gitignored (not a secret, but not committed either);
      # generate it fresh with the exact alias/passwords signingConfigs.debug expects.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # -Pe2eBundleJs embeds the JS bundle so the app runs without Metro
      - name: Build debug APK (embedded JS bundle)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug -Pe2eBundleJs=true --no-daemon -q

      # Publish the installable APK so a fresh build can be sideloaded for manual
      # device testing straight from the run — no local Android toolchain needed.
      # The bundle is embedded, so it runs standalone (debug-signed).
      #
      # Uploaded ONLY on an explicit manual dispatch with upload_debug_apk=true
      # — not on every ordinary push/PR run. This ~34.6 MB APK, uploaded
      # unconditionally on every successful run (previously bounded only by a
      # retention-days fix, see that commit's own comment below), was
      # confirmed the dominant contributor to a GitHub Actions artifact
      # storage quota exhaustion that failed CI's E2E job before Maestro ever
      # ran (docs/audit/PHASE_8A_10_ARTIFACT_QUOTA_INVESTIGATION.md,
      # docs/audit/PHASE_8A_10_ARTIFACT_SIZING_FORENSICS.md). The APK is
      # still built and installed on the emulator for every run — Maestro
      # needs it either way — this only changes whether it is *retained* as
      # a downloadable run artifact afterward. Run this workflow manually
      # ("Run workflow" in the Actions UI, or `gh workflow run ci.yml -f
      # upload_debug_apk=true`) with the input checked when you actually
      # need to pull down a build for device sideloading.
      - name: Upload debug APK
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_debug_apk == true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          # Bounded explicitly rather than left on the account default
          # (commonly 90 days) — kept as belt-and-braces even though this
          # step no longer fires on ordinary runs, so a manually-requested
          # upload still can't silently revert to unbounded retention.
          retention-days: 7

      # PHASE 8A-11/8A-12: converts the investigation's inferred disk
      # pressure into measured evidence, bracketing the exact step
      # (Setup Android emulator's own SDK-package install) that ran out of
      # space in PHASE_8A_11_RUNNER_DISK_INVESTIGATION.md. if: always() so
      # this still runs -- and this run's numbers are still captured -- even
      # if an earlier step in this job already failed.
      - name: Disk usage before Android SDK/emulator setup
        if: always()
        run: |
          echo "::group::Disk usage"
          df -h
          echo "::endgroup::"
          echo "::group::Known large directories"
          du -sh ~/.gradle 2>/dev/null || true
          du -sh "$GITHUB_WORKSPACE/node_modules" 2>/dev/null || true
          du -sh /usr/local/lib/android/sdk 2>/dev/null || true
          echo "::endgroup::"

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: shams_test
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # NOTE: the runner executes each script line in a separate shell, so
          # env exports do not persist between lines — keep commands self-contained.
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb emu geo fix 67.0011 24.8607
            curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION=1.39.0 bash
            # PHASE 8A-20 (Finding A Diagnostic Authorization, checkpoint
            # d54a12a): capture logcat for the whole Maestro run, so a
            # crash/exception during boot or a flow is visible in the job's
            # own log output even when the artifact upload (Finding B,
            # separately tracked and NOT addressed here) fails. `nohup ... &`
            # so the background process survives this script line's own
            # shell exiting -- each line above runs in its own separate
            # shell (see the NOTE above), so a plain `&` alone would risk
            # the job losing it.
            adb logcat -c
            nohup adb logcat -v threadtime > "$HOME/logcat.txt" 2>&1 &
            # PHASE 8A-26 (resource-constraint diagnostic authorization,
            # checkpoint 8ff35d4): PHASE_8A_25 found the actual obstruction
            # at assertion-failure time is a SystemUI ANR ("System UI isn't
            # responding"), not an app render failure -- consistent with,
            # but not yet measured evidence for, the AVD's own tight
            # hw.ramSize=1536M/hw.cpu.ncore=2 budget causing runner-side
            # resource pressure.
            #
            # PHASE 8A-30 (timestamp-correlation diagnostic authorization,
            # checkpoint c51fff0): PHASE_8A_29 found sustained host-side CPU
            # contention (the qemu emulator process alone at 165-174% of a
            # core) but explicitly could not establish whether that
            # contention precedes/coincides with the SystemUI ANR, or
            # confirm SystemUI's own CPU usage (the host can only see the
            # single qemu process -- SystemUI's own CPU accounting is a
            # guest-OS concept, invisible from the host). This tightens the
            # host sampler from 10s to 3s intervals and adds a guest-side
            # sampler alongside it (below), so both can be compared on a
            # shared, host-UTC timeline. Still observability only -- no
            # AVD/emulator config or flow change is made here.
            nohup bash -c 'while true; do date -u +%FT%TZ; free -h; echo "--- top by CPU ---"; ps aux --sort=-%cpu | head -8; echo "--- top by MEM ---"; ps aux --sort=-%mem | head -8; echo; sleep 3; done' > "$HOME/resource-usage.txt" 2>&1 &
            # PHASE 8A-30: guest-side per-process CPU, straight from the
            # Android OS's own accounting (`dumpsys cpuinfo` reports a
            # TOTAL line plus a per-process breakdown, including
            # com.android.systemui and this app's own process by name) --
            # this is the only way to see SystemUI's own CPU consumption at
            # all, distinct from and complementary to the host-side qemu
            # process figure above. Same 3s cadence, same host `date -u`
            # timestamp source as the host sampler, so the two files share
            # one clock and can be read side by side without a conversion
            # step.
            nohup bash -c 'while true; do date -u +%FT%TZ; adb shell dumpsys cpuinfo 2>&1; echo; sleep 3; done' > "$HOME/guest-cpuinfo.txt" 2>&1 &
            # PHASE 8A-30: one-time capture of the guest's own clock against
            # the host's `date -u` above -- correlating a guest-OS
            # timestamp (e.g. from logcat, which uses the guest's own local
            # clock) against the host-UTC-stamped samples above requires
            # knowing this offset; without it, any such correlation is only
            # approximate. Captured once, immediately, since both sampler
            # loops above are now already running in the background.
    echo "host (date -u):  $(date -u +%FT%T.%3NZ)" > "$HOME/clock-offset.txt"              echo "host (date -u):  $(date -u +%FT%T.%3NZ)"
    echo "guest (adb shell date -u): $(adb shell date -u 2>&1)" >> "$HOME/clock-offset.txt"            } > "$HOME/clock-offset.txt"
            # No `|| true` here: a real Maestro failure must fail this step,
            # and therefore the job. The two steps below both run
            # `if: always()`, so removing `|| true` does not stop the JUnit
            # report from being generated (Maestro writes maestro-results.xml
            # on its own regardless of overall pass/fail) or from being
            # uploaded/published — see PHASE_2A_REPORT.md for the reasoning
            # and what could only be verified by an actual GitHub Actions run.
            "$HOME/.maestro/bin/maestro" test --format junit --output maestro-results.xml .maestro/ci/

      # PHASE 8A-11/8A-12: the "after" bracket to the disk-usage step above,
      # captured regardless of outcome -- gives a direct before/after
      # comparison for every future run, not just ones that happen to fail.
      - name: Disk usage after Android SDK/emulator setup
        if: always()
        run: df -h

      # PHASE 8A-20 (Finding A Diagnostic Authorization, checkpoint d54a12a):
      # surfaces the logcat captured during the emulator script above, and
      # lists/inlines whatever Maestro itself already writes to
      # ~/.maestro/tests/ on a flow failure (screenshots + view-hierarchy
      # dumps -- Maestro's own existing behavior, not new capture logic).
      # Printed to the job's own log output deliberately -- independent of
      # the artifact-upload path below, which Finding B (tracked
      # separately, NOT addressed by this authorization) can still fail.
      - name: Show logcat and preserved Maestro debug artifacts
        if: always()
        run: |
          echo "::group::logcat -- FATAL/crash/exception lines"
          grep -iE "FATAL|AndroidRuntime|Exception|chromium" "$HOME/logcat.txt" 2>/dev/null | tail -200 || echo "no matches / logcat.txt not found"
          echo "::endgroup::"
          # PHASE 8A-30 (timestamp-correlation diagnostic authorization,
          # checkpoint c51fff0): a prior review searched logcat for the
          # literal substring "ANR" and found no matches -- which does not
          # contradict PHASE_8A_25's SystemUI-ANR finding (that evidence
          # came from Maestro's own hierarchy dump, not logcat), but also
          # doesn't rule out an ANR trace being present under different,
          # standard Android ANR log markers. Broader, targeted search for
          # those markers -- if any hit carries a guest-clock timestamp
          # (logcat's own threadtime format), it is the most direct
          # evidence available for correlating the ANR's actual on-screen
          # moment against the resource samples above (via the host/guest
          # clock-offset capture in the emulator step).
          echo "::group::logcat -- ANR-related markers (ActivityManager/ANR/input-dispatch-timeout/not-responding)"
          grep -iE "ActivityManager|ANR in|Input dispatching timed out|Not responding" "$HOME/logcat.txt" 2>/dev/null || echo "no matches / logcat.txt not found"
          echo "::endgroup::"
          echo "::group::logcat -- last 150 lines (general context)"
          tail -150 "$HOME/logcat.txt" 2>/dev/null || echo "logcat.txt not found"
          echo "::endgroup::"
          echo "::group::Maestro debug artifacts captured under ~/.maestro/tests/"
          find "$HOME/.maestro/tests" -type f 2>/dev/null | sort || echo "none found"
          echo "::endgroup::"
          echo "::group::Small text/XML/JSON hierarchy dumps, inlined (<50KB each)"
          # commands-*.json excluded here -- PHASE_8A_21 found these are the
          # most informative trace but routinely exceed 50KB; handled by its
          # own segment-extraction group below instead of being silently
          # dropped by this filter.
          find "$HOME/.maestro/tests" -type f \( -iname "*.xml" -o -iname "*.json" -o -iname "*.txt" \) ! -iname "commands-*.json" -size -50k -print -exec cat {} \; 2>/dev/null || true
          echo "::endgroup::"

          # PHASE 8A-22 (Finding A Diagnostic Authorization -- extraction
          # improvement only, checkpoint e747468): commands-*.json is
          # Maestro's own per-flow command trace -- PHASE_8A_21 found it's
          # the most likely file to show what the app's UI state actually
          # was when the failing assertion gave up, but it routinely
          # exceeds the <50KB filter above and so was silently excluded.
          # Rather than dumping a potentially huge full trace, extract just
          # the tail -- the last entries recorded are the ones nearest the
          # failing assertion, since Maestro appends commands as it
          # executes them. Prefers `jq` (preinstalled on GitHub-hosted
          # runners) for a structurally valid last-10-elements slice when
          # the file parses as a JSON array; falls back to a raw byte-tail
          # otherwise so this still produces something readable if the
          # file's actual shape differs from what's assumed here.
          echo "::group::commands-*.json -- last entries per flow (diagnostic segment)"
          shopt -s nullglob
          for f in "$HOME"/.maestro/tests/*/commands-*.json; do
            echo "--- $f ($(wc -c < "$f") bytes) ---"
            if command -v jq >/dev/null 2>&1 && jq -e 'type == "array"' "$f" >/dev/null 2>&1; then
              jq '.[-10:]' "$f" 2>/dev/null || tail -c 20000 "$f"
            else
              tail -c 20000 "$f"
            fi
            echo
          done
          shopt -u nullglob
          echo "::endgroup::"

      # PHASE 8A-26 (resource-constraint diagnostic authorization,
      # checkpoint 8ff35d4): surfaces the runner memory/CPU sampler started
      # above, plus a kernel-level OOM check -- both aimed at testing
      # whether host-side resource pressure correlates with the SystemUI
      # ANR PHASE_8A_25 found obstructing the screen at assertion-failure
      # time. Observability only.
      #
      # PHASE 8A-28 (relocation authorization, checkpoint 2ded199): moved
      # here, after "Show logcat and preserved Maestro debug artifacts",
      # instead of its original position right after "Disk usage after
      # Android SDK/emulator setup". PHASE_8A_27_CI_VERIFICATION_RUN436.md
      # found get_job_logs silently caps its returned payload to a job's
      # final ~4999 lines/~565KB regardless of the tail_lines value
      # requested, and that the large inlined view-hierarchy JSON dump in
      # "Show logcat..." was consuming that entire budget on its own --
      # pushing this step's output (and the toolchain-capture step below)
      # outside the retrievable window every time. Running both after that
      # large-output step, rather than before it, means their output is now
      # the part of the log nearest the end and so the part any tail-based
      # log fetch keeps. Diagnostic content and behavior are unchanged --
      # this is a reordering only.
      - name: Show runner resource usage and OOM check
        if: always()
        run: |
          echo "::group::Memory/CPU samples during Maestro run (every 3s, host-UTC timestamped)"
          cat "$HOME/resource-usage.txt" 2>/dev/null || echo "resource-usage.txt not found"
          echo "::endgroup::"
          echo "::group::dmesg -- OOM-killer / memory-pressure evidence"
          sudo dmesg 2>/dev/null | grep -iE "oom|out of memory|killed process|memory pressure" || echo "no OOM-related dmesg lines found (or dmesg unavailable)"
          echo "::endgroup::"
          # PHASE 8A-30 (timestamp-correlation diagnostic authorization,
          # checkpoint c51fff0): guest-side per-process CPU (from the
          # Android OS's own accounting, including com.android.systemui by
          # name), on the same 3s/host-UTC cadence as the host sampler
          # above -- and the one-time host/guest clock-offset capture that
          # makes any cross-referencing against guest-clock-timestamped
          # evidence (e.g. logcat) an informed comparison rather than a
          # guess. Both observability only.
          echo "::group::Guest-side (dumpsys cpuinfo) samples during Maestro run (every 3s, host-UTC timestamped)"
          cat "$HOME/guest-cpuinfo.txt" 2>/dev/null || echo "guest-cpuinfo.txt not found"
          echo "::endgroup::"
          echo "::group::Host/guest clock offset (for correlating guest-clock-timestamped evidence, e.g. logcat)"
          cat "$HOME/clock-offset.txt" 2>/dev/null || echo "clock-offset.txt not found"
          echo "::endgroup::"

      # PHASE 8A-20 (Finding A Diagnostic Authorization, checkpoint d54a12a):
      # captures the resolved Android SDK/emulator toolchain versions and
      # the AVD's own configuration -- the "leading, unconfirmed" toolchain-
      # drift hypothesis in PHASE_8A_18_FINDING_A_DEEPER_INVESTIGATION.md
      # can only be tested with this data. Observability only: reads and
      # prints, does not pin or change anything.
      #
      # PHASE 8A-28 (relocation authorization, checkpoint 2ded199): moved
      # here for the same reason as the step immediately above -- see that
      # step's comment.
      - name: Capture Android SDK/emulator toolchain versions
        if: always()
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "::group::platform-tools source.properties"
          cat "$SDK/platform-tools/source.properties" 2>/dev/null || echo "not found"
          echo "::endgroup::"
          echo "::group::emulator package source.properties"
          cat "$SDK/emulator/source.properties" 2>/dev/null || echo "not found"
          echo "::endgroup::"
          echo "::group::emulator -version"
          "$SDK/emulator/emulator" -version 2>/dev/null || echo "not available"
          echo "::endgroup::"
          echo "::group::AVD configuration (shams_test.avd/config.ini)"
          cat "$HOME/.android/avd/shams_test.avd/config.ini" 2>/dev/null || echo "not found"
          echo "::endgroup::"

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-results.xml
            ~/.maestro/tests/
            ~/logcat.txt
          # Same reasoning as the debug-APK upload above — bounded
          # explicitly instead of the account default, so this artifact
          # stops contributing to the same storage-quota accumulation.
          # logcat.txt added here too (PHASE 8A-20) so the full raw log is
          # available if/when this upload succeeds -- this is not a
          # Finding B fix or workaround, it is one more file in the same
          # already-existing upload step; the log-visible step above is
          # the actual, quota-independent delivery mechanism.
          retention-days: 7

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maestro E2E Results
          path: maestro-results.xml
          reporter: java-junit
          # Was `false` — dorny/test-reporter's own documented default is
          # `true` ("fail the build if there are test failures"); this had
          # been explicitly overridden to `true`'s opposite, which is a
          # second, independent way a real Maestro failure could still leave
          # the job green even if the `|| true` above were ever fixed.
          # Corrected so a report showing failed tests fails this step too.
          fail-on-error: true

      # PHASE 8A-14: explicit save, decoupled from the job's overall
      # success/failure via its own if: always() -- see the comment on
      # "Restore Gradle cache" above for why the combined action's built-in
      # post-step (post-if: success()) could never save on a run that fails
      # downstream of the restore, regardless of save-always. Skips only on
      # an exact cache hit (nothing new to write); saves on every miss or
      # partial (restore-keys) match, whether or not the rest of the job
      # passed.
      - name: Save Gradle cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
