name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    # ready_for_review is not a default pull_request event. Without it,
    # marking a draft ready would not start CI, and the E2E jobs (skipped
    # on drafts, see e2e-build) would never run until the next push.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      upload_debug_apk:
        description: >-
          Upload the debug APK as a run artifact (for manual device
          sideloading). Off by default — see the "Upload debug APK" step's
          own comment for why ordinary CI runs no longer do this
          unconditionally.
        type: boolean
        default: false
      run_signup_journey:
        description: >-
          Also run the signup-journey Maestro flow. Off by default — it is
          on-demand only (see the e2e-test matrix comment).
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same PR cancels that PR's in-progress run: only the
# latest commit's result matters there, and each stale run otherwise burns
# full E2E minutes (issue #119). Pushes to main are NEVER cancelled: each
# gets its own group (its run id), so every main commit is fully tested
# and the workflow_run-gated deploys see every result, exactly as before.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-quality:
    name: App Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Dead code guard (orphans)
        run: npm run check:orphans

      # network_security_config.xml's <pin-set expiration="..."> is a silent
      # failure mode: Android stops enforcing pinning on that date with no
      # crash, no error, nothing in a report -- only a check that runs on
      # every build and fails ahead of time catches it before launch.
      - name: Certificate pin expiry check
        run: npm run check:cert-pin-expiry

  functions-quality:
    name: Functions Quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # PHASE 5B-R: functions/src/engine/ is a generated mirror of
      # src/astrology/ (see functions/scripts/sync-engine.mjs). This fails
      # fast, with a named/attributable step, if the committed mirror has
      # drifted from its source — before Lint or Build get a chance to run
      # against (or silently paper over) stale engine code. See
      # docs/audit/PHASE_5B_REMEDIATION.md.
      - name: Verify engine mirror is in sync
        run: npm run verify-engine-sync

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

  e2e-build:
    name: E2E Build (debug APK)
    runs-on: ubuntu-24.04
    needs: app-quality
    # E2E (this build plus the 3 emulator legs, the bulk of CI's billed
    # minutes, issue #119) runs on every push to main, on manual runs, and on
    # PRs that are ready for review. Draft PRs skip it; marking one ready
    # starts it (see the ready_for_review trigger above). main is unchanged,
    # so the deploy gate still waits on full E2E. e2e-test needs this job,
    # so it is skipped with it. A skipped job counts as passing, so the
    # workflow still concludes on App/Functions Quality for a draft.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # PR #125 originally set this to 30, assuming ~13-14min based on typical
    # runs -- but this same build step had already been observed taking
    # 32min once under the CPU contention documented in issue #124, and a
    # real run then got cancelled by exactly this timeout mid-build. Bumped
    # to match the original (pre-#125) combined job's 60min budget, which
    # covers the worst case actually seen so far with real headroom.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # PHASE 8A-11 (original comment, preserved from before PR #125's split):
      # the debug APK build below reinstalls its own pinned NDK and CMake via
      # `sdkmanager` regardless of what's preinstalled, so the runner's
      # preinstalled NDK is dead weight. Combined with unused preinstalled
      # tooling (.NET, Haskell/GHC, Boost, CodeQL) and stale Docker images,
      # this was leaving too little disk for the build itself, not just the
      # emulator image that used to follow it in the same job. PR #125 only
      # kept this cleanup in e2e-test (reasoning it was for the emulator
      # alone), dropping it from e2e-build entirely -- the next two real
      # builds after that split then hung and died mid-build with
      # unrecoverable logs, consistent with the runner running out of disk.
      # Restored here since this job builds the APK regardless of whether
      # e2e-test's emulator ever runs.
      - name: Free disk space (remove unused preinstalled tooling)
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Use real google-services.json from secret if available,
      # otherwise fall back to the CI mock (structure-valid, placeholder creds).
      # The mock allows Gradle to compile with Firebase calls failing at
      # runtime, acceptable for a build-only job. With GOOGLE_SERVICES_JSON
      # set (the normal case for this repo), the E2E job runs against the
      # REAL production Firebase project (shams-app-4d0e7) — Auth, Firestore,
      # and Cloud Functions calls are all live, not stubbed. See issue #131:
      # 02_signup_journey creates a real throwaway account in production
      # Auth on every run as a result.
      - name: Write google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
            echo "Using real google-services.json from secret"
          else
            cp android/app/google-services.json.ci android/app/google-services.json
            echo "Using CI mock google-services.json (no secret configured)"
          fi

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: gradle-

      # android/app/debug.keystore is committed (see .gitignore's own
      # comment on it), not generated per run. #132's root cause: a fresh
      # `keytool -genkeypair` every run produces a different SHA-1 every
      # time, which Firebase's Android API key restrictions can never be
      # configured to allow -- every CI signup was rejected with
      # "[auth/unknown] ... Requests from this Android client application
      # ... are blocked." This step now only verifies the committed file
      # is present and matches signingConfigs.debug's expected alias,
      # rather than replacing it with a new, unregistered identity.
      - name: Verify committed debug keystore
        run: |
          keytool -list -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey

      # Record runner size up front: if the build below stalls until the job
      # timeout, this is still in the log (PR #123's stalled build had no
      # runner size or task names to diagnose from).
      - name: Runner resources
        run: nproc && free -m

      # -Pe2eBundleJs embeds the JS bundle so the app runs without Metro.
      # -PreactNativeArchitectures=x86_64: the E2E emulator is x86_64, so skip
      # the arm64-v8a native compile -- halves the C++ build, which is where a
      # cold build exhausted memory + swap on this 7.75 GB runner (#123).
      # --console=plain (not -q) prints one line per Gradle task, so a stall
      # shows which task it is in instead of going silent.
      - name: Build debug APK (embedded JS bundle)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug -Pe2eBundleJs=true -PreactNativeArchitectures=x86_64 --no-daemon --console=plain

      # Handoff artifact for the e2e-test matrix below — each matrix leg
      # downloads this instead of rebuilding, so the ~13min Gradle build
      # happens once per run, not once per flow. Internal/short-lived:
      # not the same artifact as the public "app-debug-apk" download below.
      - name: Upload debug APK (internal, for e2e-test matrix)
        uses: actions/upload-artifact@v6
        with:
          name: e2e-debug-apk-internal
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      # Publish the installable APK so a fresh build can be sideloaded for manual
      # device testing straight from the run — no local Android toolchain needed.
      # The bundle is embedded, so it runs standalone (debug-signed).
      #
      # Uploaded ONLY on an explicit manual dispatch with upload_debug_apk=true
      # — not on every ordinary push/PR run. This ~34.6 MB APK, uploaded
      # unconditionally on every successful run (previously bounded only by a
      # retention-days fix, see that commit's own comment below), was
      # confirmed the dominant contributor to a GitHub Actions artifact
      # storage quota exhaustion that failed CI's E2E job before Maestro ever
      # ran (docs/audit/PHASE_8A_10_ARTIFACT_QUOTA_INVESTIGATION.md,
      # docs/audit/PHASE_8A_10_ARTIFACT_SIZING_FORENSICS.md). The APK is
      # still built and installed on the emulator for every run — Maestro
      # needs it either way — this only changes whether it is *retained* as
      # a downloadable run artifact afterward. Run this workflow manually
      # ("Run workflow" in the Actions UI, or `gh workflow run ci.yml -f
      # upload_debug_apk=true`) with the input checked when you actually
      # need to pull down a build for device sideloading.
      - name: Upload debug APK
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_debug_apk == true
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          # Bounded explicitly rather than left on the account default
          # (commonly 90 days) — kept as belt-and-braces even though this
          # step no longer fires on ordinary runs, so a manually-requested
          # upload still can't silently revert to unbounded retention.
          retention-days: 7

  e2e-test:
    name: E2E Tests (Maestro) / ${{ matrix.id }}
    runs-on: ubuntu-24.04
    needs: e2e-build
    # Same reasoning as e2e-build's timeout above: single-flow legs observed
    # so far run ~6-20min, but given the same runner contention (issue #124)
    # swings e2e-build's duration by more than 2x run to run, bumped for
    # real headroom rather than the tightest number seen so far.
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    strategy:
      # issue #124: running all 3 flows in one Maestro process against one
      # adb connection meant a mid-flow adb/emulator hiccup (confirmed via
      # CI evidence to be CPU-starvation-driven on this standard 2-vCPU
      # runner, not a logcat or GPU-backend config issue) took down all 3
      # flows together, and the shared ~15-20min session gave contention
      # more time to surface. Splitting into one emulator + one adb
      # connection + one flow per matrix leg doesn't add CPU, but bounds a
      # hiccup's blast radius to the one flow it hit, and each leg's own
      # shorter session is less likely to hit the failure window at all.
      fail-fast: false
      # signup-journey runs ON DEMAND ONLY: a manual "Run workflow" with
      # run_signup_journey ticked. On this free 2-vCPU runner it failed 4/4
      # times (PRs #123 and #165, 30 Sep - 1 Oct) the same way -- "Android
      # driver unreachable" ~10-11 min in, right after the sign-up network
      # round-trip, load 4.9-5.5, no app crash -- including on a PR that
      # changed no app code. As a per-push check it gave no signal and cost
      # ~25 runner-minutes per run; the on-device test covers the same
      # journey on real hardware. Built with fromJSON because a matrix
      # `exclude` cannot remove an entry that `include` added.
      matrix:
        include: ${{ fromJSON(format('[{0}{1}]', '{"id":"auth-signin","flow":"01_auth_validation.yaml"},{"id":"settings-signout","flow":"03_settings_and_signout.yaml"}', (github.event_name == 'workflow_dispatch' && inputs.run_signup_journey) && ',{"id":"signup-journey","flow":"02_signup_journey.yaml"}' || '')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # settings-signout signs in with a pre-seeded Firebase Auth test
      # account (.maestro/ci/03_settings_and_signout.yaml's own header) via
      # the E2E_TEST_ACCOUNT_EMAIL/PASSWORD secrets. Unset, Maestro's
      # ${VAR} interpolation resolves to an empty string, the flow types a
      # blank email/password, Firebase Auth sign-in fails, the app never
      # leaves the Auth screen, and the flow burns its full 90s
      # extendedWaitUntil on 'settings-gear-btn' — plus emulator boot, APK
      # install, and Maestro's own polling overhead — before failing ~7
      # minutes in with "Assertion is false: id: settings-gear-btn is
      # visible", a message that does not point at the actual cause. This
      # fails the SAME way (still red, same gate) but in seconds, with a
      # message that does.
      - name: Verify E2E test account secrets are configured (settings-signout only)
        if: matrix.id == 'settings-signout'
        run: |
          if [ -z "${{ secrets.E2E_TEST_ACCOUNT_EMAIL }}" ] || [ -z "${{ secrets.E2E_TEST_ACCOUNT_PASSWORD }}" ]; then
            echo "::error::E2E_TEST_ACCOUNT_EMAIL and/or E2E_TEST_ACCOUNT_PASSWORD repository secrets are not set. settings-signout needs them to sign in with a pre-seeded Firebase Auth account already provisioned in shams-app-4d0e7 (see .maestro/ci/03_settings_and_signout.yaml's header for the account's required state: free plan, onboarding complete). Set both under Settings -> Secrets and variables -> Actions to fix this leg — this is a repository configuration gap, not an app or test bug."
            exit 1
          fi

      # PHASE 8A-11: the debug APK build reinstalls its own pinned NDK and
      # CMake via `sdkmanager` regardless of what's preinstalled (confirmed
      # in CI logs), so the runner's preinstalled NDK is dead weight. Combined
      # with unused preinstalled tooling (.NET, Haskell/GHC, Boost, CodeQL) and
      # stale Docker images, this was leaving too little disk for the ~1GB
      # Android system image `Setup Android emulator` pulls afterward —
      # confirmed failing with "No space left on device" on every recent CI
      # run on main. This only removes tooling this job never touches. Kept
      # here (not just in e2e-build) because this job is the one that
      # actually boots the emulator and needs the headroom.
      - name: Free disk space (remove unused preinstalled tooling)
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Download debug APK (from e2e-build)
        uses: actions/download-artifact@v7
        with:
          name: e2e-debug-apk-internal
          path: android/app/build/outputs/apk/debug/

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Named for what it actually does, not just what it starts: this step's
      # own `script:` runs the emulator boot AND the full Maestro invocation
      # in one shell (see the script's own comment below) -- a Maestro test
      # failure reports as this step failing, which previously read as an
      # "emulator setup" failure even on runs where the emulator booted and
      # ran fine for minutes before the actual test assertion failed. issue
      # #124's investigation lost time to that misleading label more than
      # once.
      - name: Boot emulator + run Maestro flow
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # settings-signout (issue #124 / PR #125 fix): each matrix leg now
          # boots its own emulator, so this flow signs in with a dedicated,
          # pre-seeded account instead of relying on 02_signup_journey's
          # session having run first on a shared device. Maestro only
          # auto-interpolates ${VAR} in flow YAML from host env vars whose
          # names start with MAESTRO_ -- an unprefixed name here would
          # silently resolve to empty in the flow instead of erroring.
          # Harmless to pass to the other two legs, which don't reference
          # them.
          MAESTRO_E2E_TEST_ACCOUNT_EMAIL: ${{ secrets.E2E_TEST_ACCOUNT_EMAIL }}
          MAESTRO_E2E_TEST_ACCOUNT_PASSWORD: ${{ secrets.E2E_TEST_ACCOUNT_PASSWORD }}
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # issue #124: this action writes hw.cpu.ncore from its own `cores`
          # input, which defaults to 2, so the AVD config said 2 vCPUs while
          # emulator-options said -cores 1. qemu kept using ~172-180% CPU
          # even at 720x1600 (PR #146's first run). Set it here too so the
          # config and the command line agree on one guest vCPU.
          cores: 1
          avd-name: shams_test
          force-avd-creation: false
          # issue #124: run #532's diagnostics (PR #134) measured qemu at
          # ~190% CPU on this 2-vCPU runner -- effectively claiming both
          # cores for itself, leaving adb/Maestro/the host's own processes
          # to contend for what's left. Load average hit 6-7 (3-3.5x
          # oversubscribed). Capping qemu to a single core is the free
          # mitigation to try before any runner-tier spend -- if load stays
          # above ~4 or adb still drops after this, that's the evidence a
          # bigger runner is actually needed, not a guess.
          #
          # issue #124, follow-up: -cores 1 capped the guest vCPU, but qemu
          # still used 150-167% host CPU (load 3.3-5.0 on nproc=2, PR #143's
          # auth-signin run, job 107244470730). The rest is display rendering:
          # -gpu swiftshader_indirect draws every frame in software on the
          # HOST, outside the -cores cap, and that cost scales with pixel
          # count. That run's JS thread and auth bootstrap were on time; the
          # Auth screen just never got painted within 90s.
          #
          # 2026-09-25 (job 36115578825, PR #154): the "bigger runner needed"
          # evidence this comment asked for came in — signup-journey failed
          # on the final "Grant location access" wait after a full ~10min run
          # with load average sustained at 3.2-4.9 (never once dropping below
          # nproc=2) and qemu itself pinned at 170-183% host CPU the entire
          # time. No OOM (dmesg clean) and no app-side crash — this run was
          # simply CPU-starved end to end, same signature as run #532 above,
          # just landing on the last wait instead of an earlier one this time.
          # Owner decision: accept this as a known, non-blocking flake rather
          # than pay for GitHub's hosted Larger Runners (a per-minute billed
          # upgrade) — the explicit constraint is keeping Actions billing at
          # $0. A self-hosted runner on owner-provided hardware would be the
          # only remaining zero-Actions-cost path to more headroom; nothing
          # else in this repo increases the vCPUs available to qemu. Until
          # that's stood up, expect signup-journey (the longest of the three
          # flows) to occasionally fail this way — re-running the job is the
          # correct response, not re-investigating this root cause.
          # -skin 720x1600 cuts the rendered pixels per frame from 2.59M
          # (pixel_6's 1080x2400) to 1.15M (-56%). The matching density is
          # set right after boot in `script` below (wm density 280, since
          # 720/1080 * 420 = 280), so the app lays out at the same
          # 411x914dp as on pixel_6 and the flows (which find elements by
          # id/text, not coordinates) see the same screens.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -cores 1 -skin 720x1600
          disable-animations: true
          # NOTE: the runner executes each script line in a separate shell, so
          # env exports do not persist between lines — keep commands self-contained.
          #
          # The `adb logcat -c` + `nohup adb logcat ... &` pair replaces a prior
          # post-hoc `adb logcat -d -t 500 ReactNativeJS:V AndroidRuntime:E *:S`
          # snapshot taken after Maestro gave up. That snapshot came back empty
          # on a real failing run (3/3 flows failing waiting for the Auth
          # screen's first element) -- a fixed-size ring-buffer dump taken
          # minutes into the job only shows whatever emulator/system chatter
          # hadn't already scrolled it out, not the app's own boot sequence.
          # Capturing continuously from before install, to a file, keeps the
          # JS bundle's actual boot log and any thrown error regardless of how
          # long the flow runs before timing out. Each script line already
          # runs in its own non-interactive `sh -c` (see the NOTE above), so
          # `nohup` alone is enough to keep it writing once that line's shell
          # exits -- the background job is simply reparented, not sent
          # SIGHUP. `disown` is a bash builtin, not available under `sh`
          # (dash) on this runner, and unnecessary here besides: it
          # previously failed the whole step with exit 127 before Maestro
          # ever ran.
          # The Maestro install below retries: PR #146 run 1 attempt 2 (job
          # 107265565097) lost the download to "curl: (35) Recv failure:
          # Connection reset by peer", got a corrupt zip, and failed with
          # exit 127 (maestro: not found) before any flow ran. Each script
          # line runs in its own `sh -c`, so the retry is one line; it also
          # checks the binary exists instead of trusting the pipe's status.
          script: |
            adb shell wm density 280
            adb shell wm size
            adb shell wm density
            adb logcat -c
            nohup adb logcat -v threadtime > logcat_full.txt 2>&1 &
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb emu geo fix 67.0011 24.8607
            for i in 1 2 3; do curl -fsSL --retry 3 --retry-all-errors "https://get.maestro.mobile.dev" | MAESTRO_VERSION=1.39.0 bash && [ -x "$HOME/.maestro/bin/maestro" ] && break; echo "Maestro install attempt $i failed; retrying in 15s"; rm -rf "$HOME/.maestro"; sleep 15; done; [ -x "$HOME/.maestro/bin/maestro" ] || { echo "Maestro install failed after 3 attempts"; exit 1; }
            # issue #124: signup-journey has repeatedly lost its emulator
            # entirely mid-flow ("device not found" / "device offline" /
            # "Android driver unreachable") with no evidence yet of *when*
            # in the flow it happens or what the box's resources looked like
            # at that exact moment -- a free -m taken after the run (in the
            # report step below) only shows memory once the load is already
            # gone, and would miss CPU saturation or memory pressure that
            # never actually triggered a kill. Sampling adb presence,
            # memory, load average, and whether qemu itself is still alive
            # together every 15s (same nohup-backgrounding reasoning as the
            # logcat capture above) pins down which of two different causes
            # this is: qemu dying (cross-reference the timestamp against
            # dmesg below for an OOM kill) vs. qemu still running but
            # starved of CPU while adb loses it anyway.
            nohup sh -c 'while true; do date -u +%Y-%m-%dT%H:%M:%SZ; adb devices; free -m | sed -n 2p; cat /proc/loadavg; ps -o rss=,pcpu=,comm= -C qemu-system-x86_64 || echo "qemu: not running"; sleep 15; done' > adb_watch.txt 2>&1 &
            # No `|| true` here: a real Maestro failure must fail this step,
            # and therefore the job. The two steps below both run
            # `if: always()`, so removing `|| true` does not stop the JUnit
            # report from being generated (Maestro writes maestro-results.xml
            # on its own regardless of overall pass/fail) or from being
            # uploaded/published — see PHASE_2A_REPORT.md for the reasoning
            # and what could only be verified by an actual GitHub Actions run.
            "$HOME/.maestro/bin/maestro" test --format junit --output maestro-results.xml .maestro/ci/${{ matrix.flow }}

      - name: Report resource state (issue #124 — is the emulator getting OOM-killed or CPU-starved?)
        if: always()
        run: |
          echo "--- adb/memory/load/qemu log, sampled every 15s during the run ---"
          cat adb_watch.txt || echo "(adb_watch.txt not found)"
          echo "--- CPU count (nproc, for context on the load-average figures above) ---"
          nproc
          echo "--- kernel OOM/killed-process messages ---"
          sudo dmesg -T | grep -iE "killed process|out of memory|oom" | tail -20 || echo "(no OOM/killed-process lines found in dmesg)"

      - name: Print app boot logcat (console, not artifact-quota-dependent)
        if: always()
        run: |
          # The artifact upload below has been failing outright ("Artifact
          # storage quota has been hit") on recent runs, so logcat_full.txt
          # never reaches anyone who needs it to diagnose a failure. Printing
          # the JS-bundle/app-crash-relevant lines straight to this step's own
          # console log survives that entirely -- it costs no storage quota.
          # Anchoring on actual log tags (RNFB*, ReactNativeJS,
          # FirebaseApp/Crashlytics, AndroidRuntime, a real crash marker)
          # rather than a bare package-name substring excludes noise like
          # Maestro's own "Skipping invisible child: ..." dumps (which quote
          # the app's package name in every line) at the source. Each matrix
          # leg now runs a single flow, so this tail is far less likely to
          # scroll relevant lines out than when all 3 flows shared one log.
          grep -E "RNFB|ReactNativeJS|FirebaseApp|FirebaseCrashlytics|FirebaseInitProvider|AndroidRuntime|FATAL EXCEPTION|DEBUG *: *pid" logcat_full.txt | tail -500 || echo "(no matching logcat lines found)"

      - name: Upload full emulator logcat
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logcat-full-${{ matrix.id }}
          path: logcat_full.txt
          if-no-files-found: warn
          # Same bounded-retention reasoning as the other artifacts in this
          # job -- see e2e-build's debug-APK upload step comment.
          retention-days: 7

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-results-${{ matrix.id }}
          path: |
            maestro-results.xml
            ~/.maestro/tests/
          # ~/.maestro/tests/ already includes Maestro's own per-assertion
          # failure screenshots -- nothing further to add here to capture
          # them. Bounded retention for the same storage-quota reasoning as
          # the other artifacts in this job.
          retention-days: 7

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Maestro E2E Results (${{ matrix.id }})
          path: maestro-results.xml
          reporter: java-junit
          # Was `false` — dorny/test-reporter's own documented default is
          # `true` ("fail the build if there are test failures"); this had
          # been explicitly overridden to `true`'s opposite, which is a
          # second, independent way a real Maestro failure could still leave
          # the job green even if the `|| true` above were ever fixed.
          # Corrected so a report showing failed tests fails this step too.
          fail-on-error: true
