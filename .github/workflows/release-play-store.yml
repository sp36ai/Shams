name: Release to Play Store

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Google Play's Edits API allows exactly one open edit per app at a time,
# across every track. Merging several PRs in quick succession — each one
# independently matching the push trigger below — used to fire that many
# concurrent runs, and every run after the first to reach the upload step
# got "This edit has expired, please create a new Edit." from
# r0adkll/upload-google-play: a real, silent release failure, not a flake.
# Queue instead of racing: don't cancel a run mid-upload (that could leave
# Play Console with a half-finished edit), just make the next one wait for
# the current one to fully commit its edit before starting.
concurrency:
  group: release-play-store
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release-play-store.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

jobs:
  release:
    name: Build AAB and deploy to Play Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision fonts
        # Fonts are not committed (see .gitignore); fetch them into
        # assets/fonts/ so the RN Gradle plugin links them into the AAB.
        # Without this the app ships in the system default font.
        run: npm run fonts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Write google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -di > android/app/google-services.json

      - name: Decode keystore
        # PRECEDENCE IS LOAD-BEARING — BASE64_KEYSTORE must win.
        #
        # Runs #61-#74 signed and shipped successfully reading BASE64_KEYSTORE.
        # A previous revision reordered this to prefer SHAMS_UPLOAD_KEYSTORE,
        # on the assumption that only one of the two secrets was ever set. If
        # both are set and they hold different keystores, that reordering
        # silently swaps which key signs the bundle: the store opens (so the
        # keystore looks fine) but Gradle then fails at :app:signReleaseBundle
        # with `Failed to read key <alias> from store: null`, because the alias
        # and key password belong to the other keystore. That is what broke
        # run #76.
        #
        # Keep the proven secret first. SHAMS_UPLOAD_KEYSTORE remains accepted
        # so a fresh setup that only sets that name still works.
        env:
          KEYSTORE_B64: ${{ secrets.BASE64_KEYSTORE || secrets.SHAMS_UPLOAD_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::No upload keystore secret set. Add the base64-encoded .jks as BASE64_KEYSTORE (what this project already uses) or SHAMS_UPLOAD_KEYSTORE."
            exit 1
          fi
          printf '%s' "${KEYSTORE_B64}" | base64 -di > android/app/shams-upload-key.jks
          if [ ! -s android/app/shams-upload-key.jks ]; then
            echo "::error::Decoded keystore is empty — the secret is not valid base64."
            exit 1
          fi

      - name: Inspect keystore (diagnostic, non-fatal)
        # NON-FATAL BY DESIGN — do not turn this back into a gate.
        #
        # Gradle's signing config is the authority on whether the keystore,
        # alias, and passwords are usable, and it has signed this app
        # successfully for months. A previous revision ran
        # `keytool -list -alias <secret>` as a hard gate with output sent to
        # /dev/null; that failed run #75 against a keystore that signs fine,
        # and discarded the error that would have explained why.
        #
        # The failure actually worth gating on — a missing or undecodable
        # keystore secret — is handled in the Decode step above.
        continue-on-error: true
        env:
          WANT_ALIAS: ${{ secrets.SHAMS_UPLOAD_KEY_ALIAS }}
        run: |
          echo "Listing keystore entries. Nothing here fails the build;"
          echo "the Build step below is what actually verifies signing."
          # Capture keytool's own exit status. Piping straight into grep would
          # report grep's status instead, which is how run #76's real failure
          # ("keytool could not list this keystore") was reduced to a single
          # line with no cause attached.
          set +e
          keytool -list -v -storetype PKCS12 \
            -keystore android/app/shams-upload-key.jks \
            -storepass "${{ secrets.SHAMS_UPLOAD_STORE_PASSWORD }}" \
            > /tmp/keytool-out.txt 2>&1
          KEYTOOL_RC=$?
          set -e

          if [ "${KEYTOOL_RC}" -ne 0 ]; then
            # The keystore could not even be opened. Distinct from "opened but
            # the alias is missing", and the two have different fixes.
            echo "::warning::keytool could NOT open this keystore (exit ${KEYTOOL_RC}). Either the decoded keystore secret and SHAMS_UPLOAD_STORE_PASSWORD are from different keystores, or the decoded bytes are not a valid PKCS12. Expect :app:signReleaseBundle to fail. keytool said:"
            sed -n '1,12p' /tmp/keytool-out.txt || true
          else
            grep -E 'Alias name:|Entry type:|Valid from:|SHA1:' /tmp/keytool-out.txt || true
            if [ -n "${WANT_ALIAS}" ] && ! grep -qiF "Alias name: ${WANT_ALIAS}" /tmp/keytool-out.txt; then
              echo "::warning::The keystore opened, but SHAMS_UPLOAD_KEY_ALIAS is not among its aliases (listed above). Expect :app:signReleaseBundle to fail with 'Failed to read key <alias> from store'."
            fi
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: gradle-

      - name: Build release AAB
        run: |
          cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon --no-build-cache --no-configuration-cache \
            -PSHAMS_UPLOAD_STORE_FILE=shams-upload-key.jks \
            -PSHAMS_UPLOAD_STORE_PASSWORD="${{ secrets.SHAMS_UPLOAD_STORE_PASSWORD }}" \
            -PSHAMS_UPLOAD_KEY_ALIAS="${{ secrets.SHAMS_UPLOAD_KEY_ALIAS }}" \
            -PSHAMS_UPLOAD_KEY_PASSWORD="${{ secrets.SHAMS_UPLOAD_KEY_PASSWORD }}" \
            -PVERSION_CODE=${{ github.run_number }}

      - name: Remove keystore
        if: always()
        run: rm -f android/app/shams-upload-key.jks

      - name: Verify AAB targetSdkVersion
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          echo "=== AAB size: $(wc -c < $AAB) bytes ==="

          # Print the intermediate merged manifest (human-readable XML before proto conversion)
          echo "=== Intermediate merged manifests ==="
          find android/app/build/intermediates -name "AndroidManifest.xml" 2>/dev/null | while read f; do
            echo "--- $f ---"
            grep -i 'uses-sdk\|targetSdk\|minSdk\|package\|versionCode\|versionName' "$f" || true
          done

          # Use bundletool to dump the actual AAB manifest
          echo "=== Fetching bundletool ==="
          wget -q "https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar" -O /tmp/bundletool.jar
          echo "=== bundletool dump manifest (sdk + version lines) ==="
          java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" \
            | grep -iE 'uses-sdk|targetSdk|minSdk|versionCode|versionName|package' || true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: shams-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Deploy to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.astrosarfaraz.shamsalasrar
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track || 'internal' }}
          # Production releases roll out staged at 10%; promote to 100% in
          # Play Console (or re-run with a higher fraction) once stable.
          status: ${{ github.event.inputs.track == 'production' && 'inProgress' || 'completed' }}
          userFraction: ${{ github.event.inputs.track == 'production' && '0.1' || '' }}
          whatsNewDirectory: android/fastlane/metadata/android/en-US/changelogs
