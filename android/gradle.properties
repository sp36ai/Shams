# Project-wide Gradle settings — Shams al-Asrār
# New Architecture ON, Hermes ON — New Arch is required by react-native-iap
# 16.x's Nitro Modules bridge (Play Billing Library 8+, issue #43).

# JVM args — sized for GitHub's free 2-vCPU / 7.75 GB runner (CI E2E build and
# release-play-store.yml's bundleRelease). With -Xmx4096m plus a separate Kotlin
# daemon JVM and the New Architecture C++ compile, a cold build filled all 3 GB
# of swap (PR #123 diagnostic run, 2026-09-30) and could stall past the job
# timeout. Metaspace is left at 1 GB: the pressure was heap + C++, not metaspace.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Compile Kotlin inside the Gradle JVM instead of a second daemon JVM with its
# own heap (see jvmargs above). Slightly slower incremental local builds; to
# opt out locally, set this to "daemon" in ~/.gradle/gradle.properties.
kotlin.compiler.execution.strategy=in-process

# Parallel builds
org.gradle.parallel=true
org.gradle.configureondemand=false

# AndroidX
android.useAndroidX=true
# @react-native-voice/voice (added for Oracle Chat's voice input) still ships
# the pre-AndroidX com.android.support:support-compat/versionedparcelable
# artifacts — without Jetifier those collide with androidx.core's own copies
# of the same classes at dex-merge time (:app:checkDebugDuplicateClasses).
# Jetifier rewrites old-support-library bytecode/manifests to their AndroidX
# equivalents so the two never coexist as distinct classes.
android.enableJetifier=true

hermesEnabled=true
newArchEnabled=true

# ABI splits — produce separate APKs per ABI to reduce download size
# (App Bundle still recommended for Play Store; this is for sideload/QA)
reactNativeArchitectures=arm64-v8a,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
PACKAGE_NAME=com.astrosarfaraz.shamsalasrar

# Kotlin
kotlin.jvm.target.validation.mode=warning

# ── Security / obfuscation ───────────────────────────────────────────
# R8 full mode: more aggressive dead-code removal, class merging, and
# interface inlining. Requires explicit keep rules for reflection users.
android.enableR8.fullMode=true

# Disable JS bundle source-map generation in release builds so no
# readable source map is embedded in or alongside the APK.
# Metro respects this when invoked from the Gradle react task.
hermesFlags=-O -output-source-map=false
