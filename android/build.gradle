// Top-level build file — Shams al-Asrār
// React Native 0.78.x — Android-first

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // r27+ builds native code with 16 KB-page-aligned ELF segments, required
        // for Play's "16 KB memory page sizes" compatibility check.
        ndkVersion = "27.1.12297006"
        // react-native-iap@16 (Nitro Modules) requires Kotlin 2.1.20+ on RN 0.79.
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // RN 0.79.5's react-native-gradle-plugin resolves AGP 8.8.2 by default,
        // but the androidx.core 1.18.0 this RN version now pulls in requires
        // AGP 8.9.1+ (CheckAarMetadataWorkAction fails otherwise). Pinned to
        // the minimum version that satisfies that requirement.
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.google.gms:google-services:4.4.2")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.2")
    }
}

// Firebase Android BoM override for @react-native-firebase 19.3.0, which pins
// BoM 32.8.1 → firebase-crashlytics-ndk 18.6.4. Those prebuilt libcrashlytics*.so
// files are not 16 KB-page-aligned, so Play rejects the bundle ("Memory page size:
// Does not support 16 KB"). NDK 19.0.2+ is aligned; BoM 33.16.0 (the last 33.x)
// maps it to 19.4.4. Stay on 33.x: BoM 34 removed the KTX modules and is far more
// likely to break RNFB 19.3.0. Remove this once RNFB itself pins a 33.x+ BoM.
project.ext {
    set('react-native', [
        versions: [
            firebase: [
                bom: "33.16.0",
            ],
        ],
    ])
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
