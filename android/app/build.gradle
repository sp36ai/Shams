apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

/**
 * Shams al-Asrār — Android app module
 * RN 0.78.x, Hermes ON, New Arch OFF, minSdk 24, targetSdk 36
 */

react {
    // Autolinking is handled by autolinkLibrariesWithApp() below (RN 0.78+ style).

    // E2E builds (-Pe2eBundleJs=true) embed the JS bundle in the debug APK so
    // the app runs on a CI emulator without a Metro dev server.
    if (project.hasProperty("e2eBundleJs")) {
        debuggableVariants = []
    }

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC).
 * Hermes is enabled, so JSC is unused — keep default.
 */
def jscFlavor = 'org.webkit:android-jsc:r250230'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk 36

    namespace "com.astrosarfaraz.shamsalasrar"

    defaultConfig {
        applicationId "com.astrosarfaraz.shamsalasrar"
        minSdk 24
        targetSdk 36
        versionCode project.hasProperty('VERSION_CODE') ? Integer.parseInt(project.property('VERSION_CODE').toString().trim()) : 4
        versionName "0.1.6"

        // react-native-iap v12 has amazon/play product flavors;
        // select "play" so the app builds without adding its own flavor dimension.
        missingDimensionStrategy "store", "play"

        // Reduce APK by stripping unused locales (we only ship en, ur, hi)
        resourceConfigurations += ["en", "ur", "hi"]

        // armeabi-v7a excluded: Windows MAX_PATH limit causes CMake object-file paths
        // to exceed 260 chars during reanimated native build. All Android 7+ (API 24+)
        // production devices are arm64-v8a. x86_64 retained for emulator testing.
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    splits {
        abi {
            reset()
            enable false   // App Bundle handles per-ABI delivery in production
            universalApk false
            include "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing — populate ~/.gradle/gradle.properties (NOT this file)
        // with: SHAMS_UPLOAD_STORE_FILE, SHAMS_UPLOAD_STORE_PASSWORD,
        //       SHAMS_UPLOAD_KEY_ALIAS, SHAMS_UPLOAD_KEY_PASSWORD
        // Phase 5 will generate the keystore.
        release {
            if (project.hasProperty('SHAMS_UPLOAD_STORE_FILE')) {
                storeFile file(project.property('SHAMS_UPLOAD_STORE_FILE'))
                storeType "PKCS12"
                storePassword project.property('SHAMS_UPLOAD_STORE_PASSWORD').toString()
                keyAlias project.property('SHAMS_UPLOAD_KEY_ALIAS').toString()
                keyPassword project.property('SHAMS_UPLOAD_KEY_PASSWORD').toString()
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Stamp the commit SHA into the debug version so a sideloaded test
            // build is uniquely identifiable (adb shell dumpsys package … |
            // grep versionName, or Settings → Apps → app info). Release builds
            // keep the clean marketing version for the Play Store.
            def gitSha = "nogit"
            try {
                def proc = ["git", "rev-parse", "--short=8", "HEAD"].execute(null, rootDir)
                proc.waitFor()
                if (proc.exitValue() == 0) {
                    gitSha = proc.text.trim()
                }
            } catch (ignored) {
                // git unavailable (e.g. building from a source tarball) — keep "nogit"
            }
            versionNameSuffix "-debug-${gitSha}"
        }
        release {
            def hasReleaseSigning = project.hasProperty('SHAMS_UPLOAD_STORE_FILE')
            // buildTypes blocks are evaluated for every Gradle invocation, not just
            // release builds — only enforce the secrets when a release task was
            // actually requested, so `assembleDebug`/CI debug builds aren't blocked.
            def isReleaseTask = gradle.startParameter.taskNames.any {
                it.toLowerCase().contains("release")
            }
            if (isReleaseTask && !hasReleaseSigning) {
                throw new GradleException(
                    "Release signing credentials are required.\n" +
                    "Set SHAMS_UPLOAD_STORE_FILE, SHAMS_UPLOAD_STORE_PASSWORD, " +
                    "SHAMS_UPLOAD_KEY_ALIAS, SHAMS_UPLOAD_KEY_PASSWORD in ~/.gradle/gradle.properties"
                )
            }
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            // proguard-android-optimize.txt enables more aggressive optimisation
            // than the default proguard-android.txt (inlines, removes dead code).
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            // Hard security: no debuggable release APKs — ever.
            debuggable false

            // Disable JS source-map bundling in release so no readable
            // source ever lands on the device filesystem.
            // (Metro's --sourcemap-output flag is not invoked in release
            //  Gradle builds by default; this is a belt-and-suspenders guard.)
            resValue "bool", "is_release_build", "true"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
            // Swiss Ephemeris WASM (Phase 2) ships as asset, not jniLib — no rules needed yet
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module',
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    implementation("androidx.appcompat:appcompat:1.7.0")

    // Google Play Services fused location. @react-native-community/geolocation
    // only uses the reliable FusedLocationProvider when this is on the
    // classpath; without it every request falls back to the legacy
    // LocationManager, which routinely returns no fix indoors — the "location
    // is required" dead end. With this present, setRNConfiguration's
    // locationProvider 'auto'/'playServices' can fuse Wi-Fi + cell + GPS.
    implementation("com.google.android.gms:play-services-location:21.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
